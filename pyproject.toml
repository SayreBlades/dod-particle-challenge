# Python environment for this project. Two roles, one env:
#   1. the report builder (scripts/build_report.py — duckdb reads the host
#      JSONL + builds the analysis tree; zai-sdk for the LLM narratives)
#   2. the Halide pipeline generator (build-time, for halide algorithms — emits
#      out/halide/*.a via src/layouts/<memory layout>/AF*.LP1-halide_gen.py)
#
# One command sets up the env (creates .venv, installs everything):
#   uv sync                      # duckdb + halide + zai-sdk (all of it)
#
# This project has no importable Python package — it's scripts + a static
# report — so tool.uv.package = false (uv sync installs deps only, not the
# project itself).

[project]
name = "dod-particles"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "duckdb",
    "halide>=21",
    "zai-sdk>=0.2.3",
]

[tool.uv]
package = false
