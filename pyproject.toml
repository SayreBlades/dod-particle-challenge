# The Python environment for this project serves two roles:
#   1. the Halide pipeline generator (build.zig invokes it via HALIDE_PYTHON
#      when a cell's walk 1 is halide — emits zig-out/halide/*.a);
#   2. the analysis notebook (experiments/results/analyze.ipynb — pandas +
#      matplotlib to turn collected CSVs into plots + champion grids).
#
# One venv, set up once:
#   uv venv .venv
#   uv pip install --python .venv/bin/python -e .
# (or: uv pip install --python .venv/bin/python halide matplotlib pandas)
[project]
name = "dod-particles"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["halide>=21", "matplotlib", "pandas"]
