name: deploy-pages

# Publish the static report (experiments/report.html + analysis/) to GitHub
# Pages whenever the SPA or the analysis tree changes on main. No build step —
# the SPA is static and the analysis bundles are committed. report.html is
# served as index.html at the site root.

on:
  push:
    branches: [main]
    paths:
      - 'experiments/report.html'
      - 'experiments/report.js'
      - 'experiments/style.css'
      - 'experiments/analysis/**'
      - 'experiments/data/**'   # the asm bundles (<algo>.json) the SPA fetches
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; new pushes cancel stale runs.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir site
          cp experiments/report.html site/index.html
          cp experiments/report.js  site/
          cp experiments/style.css  site/
          cp -r experiments/analysis site/
          # The SPA fetches the asm bundles from data/<machine_id>/<algo>.json
          # (analysis bundles no longer embed asm). Publish just those +
          # hardware.json — NOT the runs/profile JSONL rows (raw data, 5.5MB,
          # not consumed by the SPA). ~2.1MB.
          (cd experiments && find data -name '*.json' -exec cp --parents {} ../site/ \;)
          touch site/.nojekyll     # skip Jekyll (dotted/special filenames)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
